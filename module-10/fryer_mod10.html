    <!-- Main Image Will change when small images are selected -->
   <div class="main-display">

        <img id="mainImage"
            src="images/FullFamily.png"
            alt="Main Display Image">

        <span id="mainCaption">Full Family</span>

    </div>


    <div class="gallery">

    <div>
        <a href="#"
           onclick="displayImage('images/AwardWinner.png', 'Award Winner')"
           onmouseover="
                james.src='images/WhereWeAreNow.png';
                document.getElementById('caption1').innerHTML='Where We Are Now';
           "
           onmouseout="
                james.src='images/HowItStarted.png';
                document.getElementById('caption1').innerHTML='How It Started';
           ">

            <img border="0"
                 name="james"
                 src="images/HowItStarted.png">
        </a>

        <br>

        <span id="caption1">How It Started</span>
    </div>

    <div>
        <a href="#"
           onclick="displayImage('images/FamilyTrip.png', 'Family Trip')"
           onmouseover="
                family.src='images/FullFamily.png';
                document.getElementById('caption2').innerHTML='Full Family';
           "
           onmouseout="
                family.src='images/JustMarried.png';
                document.getElementById('caption2').innerHTML='Just Married';
           ">

            <img border="0"
                 name="family"
                 src="images/JustMarried.png">
        </a>

        <br>

        <span id="caption2">Just Married</span>
        <h2>Click on the images to change the main picture</h2>
    </div>

    </div>
